// plugin：主插件，依赖 core + nms 适配，打 fat jar（含 kotlin-stdlib 与 common 逻辑）。
plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://repo.dmulloy2.net/repository/public/' }
}

dependencies {
    implementation project(':core')
    implementation project(':nms-v1_21_R1')
    compileOnly 'io.papermc.paper:paper-api:1.21.1-R0.1-SNAPSHOT'
}

tasks.named('shadowJar') {
    archiveBaseName = 'OpenDreamCore-Plugin'
    archiveClassifier = ''
    // ProtocolLib / Paper API 不打进 jar（服务器已有）
    relocate 'com.opendreamcore.protocol', 'com.opendreamcore.plugin.protocol'
}

tasks.named('build') {
    dependsOn tasks.named('shadowJar')
    finalizedBy tasks.named('collectOutput')
}

tasks.register('collectOutput') {
    group = 'build'
    description = 'Collects the plugin fat jar into ../../output.'
    doLast {
        def out = file('../../output')
        out.mkdirs()
        // 只收集当前版本的 fat jar，并清掉 output 里旧版本残留，避免误用陈旧构建
        def cur = "OpenDreamCore-Plugin-${version}.jar"
        file('build/libs').listFiles()?.each { f ->
            if (f.name == cur) {
                copy { from f; into out }
                println "collected ${f.name} -> ${out.absolutePath}"
            }
        }
        file(out).listFiles()?.each { f ->
            if (f.name.startsWith('OpenDreamCore-Plugin-') && f.name != cur && f.name.endsWith('.jar')) {
                delete f
                println "removed stale ${f.name}"
            }
        }
    }
}

tasks.named('processResources') {
    filesMatching('plugin.yml') {
        expand 'version': project.version
    }
}

project(':plugin').tasks.jar {
    dependsOn project(':nms-v1_21_R1').tasks.processResources,
              project(':core').tasks.processResources
    inputs.files(
        project(':nms-v1_21_R1').tasks.processResources.outputs,
        project(':core').tasks.processResources.outputs
    )
}

project(':nms-v1_21_R1').tasks.jar {
    dependsOn project(':core').tasks.processResources
    inputs.files(project(':core').tasks.processResources.outputs)
}