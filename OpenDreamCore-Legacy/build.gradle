// OpenDreamCore-Legacy 根工程：编排各 target 的独立 Gradle 构建，外加一道 J8 语法门禁。
//
// 跟现代线（OpenDreamCore/）同一套路：settings.gradle 里没有 include 共享树，
// common-legacy / common-legacy-jdk8-pure / client-legacy 只是被各 target 用
// srcDirs 直接吃进去的源目录，不是 Gradle 子项目。根工程只做编排与门禁。
//
// 各 target 的 Gradle 版本不同；1.7.10 使用 Gradle 2.14，1.12.2/1.16.5 使用较新的 ForgeGradle。
// 各目标优先使用自己的 wrapper；不在根 settings 中纳入的目标需要进入目标目录单独构建。

// collectOutput：把当前维护范围内的三个 Legacy target 产物汇入 output/legacy，并同步到 output/all。
// 这里不处理已退出维护范围的旧目标，避免把过期产物混入当前发布目录。
// 而不读其它目录，就是为了让「collect 到的东西」与「真正的产物」只有一个来源。
//
// 另外：产物里内嵌的共享层（common-j8）可能比共享源码旧。那是构建顺序的坑，不是发布坑，
// 所以在 verifySharedLayer 里提前拦（查内嵌类而非时间戳，躲开 gradle 的取整问题）。
tasks.register('verifySharedLayer') {
    group = 'verification'
    description = 'Asserts every legacy jar actually carries the classes the shared layer defines.'
    // 不在这里写 mustRunAfter：此刻 activeTargets 还没定义（它是本文件靠后的局部变量），
    // 配置期引用会报 unknown property。顺序约束放在定义 activeTargets 之后的同名 configure 里。
    doLast {
        // 共享层里必须随包下发的类：少任何一个都意味着这个 target 拼进去的是旧共享层。
        // 挑的是只有共享层才会产出的类（visual/FontRules 就是 1.12.2 真漏过的那个）。
        def required = ['com/opendreamcore/visual/FontRules.class',
                        'com/opendreamcore/visual/VisualRules.class']
        def modVersion = providers.gradleProperty('mod_version').orNull
        if (!modVersion) {
            throw new GradleException('mod_version 未定义，无法核对内嵌共享层')
        }
        def problems = []
        ['1.7.10', '1.12.2', '1.16.5'].each { v ->
            def name = "OpenDreamCore-Legacy-forge-${v}-${modVersion}.jar".toString()
            def jar = file("targets/forge-${v}/build/libs/${name}")
            if (!jar.exists()) {
                problems << "${name}: 产物不存在"
                return
            }
            def names = new java.util.HashSet<String>()
            new java.util.zip.ZipFile(jar).withCloseable { zf ->
                def en = zf.entries()
                while (en.hasMoreElements()) { names << en.nextElement().name }
            }
            required.each { r ->
                if (!names.contains(r)) { problems << "${name}: 缺内嵌类 ${r} → 共享层是旧的" }
            }
        }
        if (problems) {
            problems.each { println "  ${it}" }
            throw new GradleException("verifySharedLayer: ${problems.size} 处共享层缺失，先烘 :common-j8:jar 再重建相关 target")
        }
        println 'verifySharedLayer: 三版内嵌共享层类齐备（FontRules/VisualRules）'
    }
}
tasks.register('collectOutput') {
    group = 'build'
    description = 'Copies the current-version legacy jars into ../output/legacy and ../output/all.'
    doLast {
        def modVersion = providers.gradleProperty('mod_version').orNull
        if (!modVersion) {
            throw new GradleException('mod_version 未定义，无法确定要收集的 legacy 产物版本')
        }
        def legacyOut = file('../output/legacy')
        def allOut = file('../output/all')
        legacyOut.mkdirs()
        allOut.mkdirs()
        def missing = []
        ['1.7.10', '1.12.2', '1.16.5'].each { v ->
            def name = "OpenDreamCore-Legacy-forge-${v}-${modVersion}.jar".toString()
            def src = file("targets/forge-${v}/build/libs/${name}")
            if (!src.exists()) { missing << name; return }
            copy { from src; into legacyOut }
            copy { from src; into allOut }
            println "collected ${name}"
        }
        // legacy 前缀的陈旧残留（非当前版本）清掉，避免发布时拿错
        [legacyOut, allOut].each { d ->
            d.listFiles()?.findAll { f ->
                f.name.startsWith('OpenDreamCore-Legacy-') && f.name.endsWith('.jar')
                        && !f.name.contains("-${modVersion}.jar")
            }?.each { it.delete() }
        }
        if (missing) {
            // 硬门禁：在建的三个远古产物缺任何一个就失败。以前这里只 println 提醒，
            // 提醒没人盯，结果 1.7.10 长期停在旧产物上，外面看就像它们没编。
            // 发布面不允许“少一个但构建通过”。
            missing.each { println "  MISSING ${it}" }
            throw new GradleException("collectOutput: 在建的三个远古产物缺 ${missing.size} 个，发布面不完整")
        } else {
            println "collectOutput: 3/3 legacy 产物已汇入 output/legacy 与 output/all"
        }
    }
}

// 共享树的 JDK8 门禁现在在 common-j8 模块里：主树源码 release 8 + Jabel 脱糖，
// verifyBytecodeLevel 验每个 class 都是 major 52。以前那棵手工抄的
// common-legacy-jdk8-pure 连同 verifyJ8 任务一起退役了——源头只有一份，漂移无处发生。
//
// 注意：这里不要再写 tasks.named('build') 去配 finalizedBy。root 工程没有 java 插件，
// 'build' 是本文件自己在下面注册的，在那个点还不存在——tasks.named 会在配置期直接抛
// 产物永远停在上一次的时间点上。finalizedBy 要挂在下面注册它的那块里。

def targetBuilds = [
        'forge-1.16.5': 'targets/forge-1.16.5',
        'forge-1.12.2': 'targets/forge-1.12.2',
        'forge-1.7.10': 'targets/forge-1.7.10',
]

def activeTargets = targetBuilds.findAll { name, dir -> file("${dir}/build.gradle").exists() }

// Independent builds keep their wrapper version and receive JVM homes from external configuration.
def isWindows = System.getProperty('os.name').toLowerCase().contains('win')
def gradlewFor = { String dir ->
    def own = file("${dir}/gradlew" + (isWindows ? '.bat' : ''))
    own.exists() ? own : file("${rootDir}/gradlew" + (isWindows ? '.bat' : ''))
}
def wrapperCommand = { File wrapper ->
    isWindows ? ['cmd', '/c', wrapper.absolutePath] : [wrapper.absolutePath]
}
def javaHomeFor = { String name ->
    def version = name == 'forge-1.16.5' ? 17 : 8
    providers.gradleProperty("java${version}Home").orElse(providers.environmentVariable("JAVA${version}_HOME")).orNull
}

// 构建任务名：forge-1.16.5 -> buildForge1165
def taskNameFor = { String targetName -> 'buildForge' + targetName.replace('forge-', '').replace('.', '') }

activeTargets.each { targetName, dir ->
    tasks.register(taskNameFor(targetName), Exec) {
        group = 'build'
        description = "Builds ${targetName} in its independent Gradle project."
        // 关键：这两个 target 是独立工程，会把 common-j8 的成品 jar 整包拼进自己包里。
        // 必须先把共享层烘出来，否则拼进去的是上一次的结果——编译能过、行为却是旧的。
        // 1.12.2 真栽过这个：它的 jar 比共享层还早建，连 visual/FontRules 都没进去。
        dependsOn ':common-j8:jar'
        workingDir rootDir
        // Gradle 2.14 requires Java 8; newer legacy builds retain their declared compiler toolchains.
        def javaHome = javaHomeFor(targetName)
        if (javaHome) { environment 'JAVA_HOME', javaHome }
        commandLine(wrapperCommand(gradlewFor(dir)) + ['-p', dir, 'build', '--console', 'plain', '--no-daemon'])
    }
}

// 顺序约束：本任务读的是 build/libs 里的 jar，必须晚于产物的构建任务，
// 否则跑早了读到的是上一轮的包，门禁形同虚设。写在这里是因为上面注册它时
// activeTargets 还不存在（配置期按文件顺序求值）。
tasks.named('verifySharedLayer').configure {
    mustRunAfter activeTargets.keySet().collect { taskNameFor(it) }
}

tasks.register('build') {
    group = 'build'
    description = 'Builds all active legacy targets, then collects their jars into output/.'
    // 顺序要紧：先烘共享层，再编 target（它们把共享层整包拼进自己包里），
    // 然后才能验「内嵌共享层是不是新的」——verifySharedLayer 同级 dependsOn 的话
    // Gradle 不保证先后，可能抢在产物建好之前验，验的是上一轮的包，白验。
    // 所以把它改成 target 任务的下游，最后才收产物。
    dependsOn ':common-j8:jar'
    dependsOn activeTargets.keySet().collect { taskNameFor(it) }
    finalizedBy tasks.named('verifySharedLayer')
    finalizedBy tasks.named('collectOutput')
}

tasks.register('listTargets') {
    group = 'help'
    description = 'Lists all configured legacy targets and how each one builds.'
    doLast {
        targetBuilds.each { name, dir ->
            println "${name}: ${dir} [${activeTargets.containsKey(name) ? 'ACTIVE' : 'placeholder'}]"
        }
        println 'forge-1.7.10: targets/forge-1.7.10 [external: Gradle 2.14 + JDK 8，进目录跑 build_with_java8.bat]'
    }
}

// verifyMatrix：逐 target 跑 compileJava，输出绿/红汇总
// 用法：gradlew.bat verifyMatrix [-PmatrixContinue=true]
tasks.register('verifyMatrix') {
    group = 'verification'
    description = 'Runs compileJava in every active legacy target and prints a green/red summary.'
    // 四个 target 都吃这个 jar，先把它烘出来再进各家编译
    dependsOn ':common-j8:jar'
    doLast {
        def continueOnFail = providers.gradleProperty('matrixContinue').map { it.toBoolean() }.orElse(false)
        def results = [:]
        activeTargets.each { name, dir ->
            def logFile = file("${rootDir}/../_verify_${name}.log")
            if (logFile.exists()) { logFile.delete() }
            def pb = new ProcessBuilder(wrapperCommand(gradlewFor(dir)) +
                    ['-p', dir, 'compileJava', '--console', 'plain', '--no-daemon'])
            def javaHome = javaHomeFor(name)
            if (javaHome) { pb.environment().put('JAVA_HOME', javaHome) }
            pb.directory(rootDir)
            pb.redirectErrorStream(true)
            def proc = pb.start()
            // 先排空再取 exitValue，否则子进程输出塞满缓冲区会死锁
            proc.inputStream.eachLine { line -> logFile.append(line + '\n') }
            results[name] = (proc.waitFor() == 0)
        }
        println '---- legacy compile matrix ----'
        def failed = []
        results.each { name, ok ->
            println "${ok ? 'GREEN' : 'RED  '}  ${name}"
            if (!ok) failed << name
        }
        println "------------------------ ${results.values().count(true)}/${results.size()} green"
        if (failed && !continueOnFail) {
            throw new GradleException("legacy compile matrix RED: ${failed.join(', ')}")
        }
    }
}

// verifyJ8 退役：它证明的是手工 pure 树的 JDK8 纯度，那棵树已删。
// 现在由 :common-j8:compileJava（release 8 + Jabel）与 :common-j8:verifyBytecodeLevel 把关。
