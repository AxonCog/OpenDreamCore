// OpenDreamCore-Legacy 1.6.4 — plain java 构建：forgeBin.jar（MCP 名 dev jar）作为编译依赖
// 绕过 ForgeGradle 1.1 的反编译工作区（官方原版 jar 已从 S3 绝迹，二进制补丁校验和永久失配）

apply plugin: 'java'

version = '0.1.2'
group = 'com.opendreamcore'
archivesBaseName = 'OpenDreamCore-Legacy-forge-1.6.4'

sourceCompatibility = targetCompatibility = '1.8'
compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
    // plain java 无混淆映射，mixin AP 会自动跑并报 No obfuscation mapping；关掉等运行时处理
    options.compilerArgs << "-proc:none"
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.spongepowered.org/maven/' }
    maven { url = 'https://maven.aliyun.com/repository/public' }
    flatDir { dirs 'libs' }
}

dependencies {
    // forgeBin.jar = MCP 名 Minecraft + FML/Forge API（FG 1.1 反编译工作区产物，缓存复用）
    compile fileTree(dir: 'libs', include: '*.jar')

    // 模组自身依赖
    compile 'org.yaml:snakeyaml:1.27'
    compile 'org.spongepowered:mixin:0.7.11-SNAPSHOT'
    compile 'com.google.code.gson:gson:2.10.1'
    compile 'org.antlr:antlr4-runtime:4.13.1'
    // 共享树换成 common-j8 成品 jar（主树源码经 Jabel 脱糖）
    compile fileTree(dir: '../../common-j8/build/libs', include: 'opendreamcore-common-j8-*.jar')
}

// 客户端接线层还是源码直接编进来
sourceSets.main.java.srcDirs += '../../client-legacy/src/main/java'

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    // 运行时要解析 YAML 页面/DreamLang 脚本/JSON 配置，三个解析库必须揸进 jar，
    // 否则实机一用就 NoClassDefFoundError（vanilla MC 没有 yaml/antlr）
    from {
        configurations.compile
                .filter { it.name.contains('snakeyaml') || it.name.contains('gson') || it.name.contains('antlr') || it.name.contains('common-j8') }
                .collect { zipTree(it) }
    }
    // MC/Forge 本体类运行时由游戏提供，绝不进 jar
    exclude '**/net/minecraft/**'
    // module-info 会让老版 fml 的 asm 报 jar 损坏、整个包被忽略，随依赖揸进来的也要剔
    exclude 'META-INF/versions/**'
    exclude '**/module-info.class'
    exclude '**/cpw/mods/**'
    exclude '**/net/minecraftforge/**'
    exclude '**/com/mojang/**'
    exclude '**/org/apache/**'
    exclude '**/org/lwjgl/**'
    exclude '**/io/netty/**'
    manifest {
        attributes(
            'Manifest-Version': '1.0',
            'FMLCorePlugin': 'com.opendreamcore.OpenDreamCorePlugin',
            'FMLCorePluginContainsFMLMod': 'true',
            'Mod-Version': version,
            'Mod-Name': 'OpenDreamCore-Legacy'
        )
    }
}

// 编译完把成品收到 output/legacy，发布面只认这一处
task collectLegacyOutput {
    doLast {
        def out = file('../../../output/legacy')
        out.mkdirs()
        file("${buildDir}/libs").listFiles()?.each { f ->
            if (f.name.endsWith('.jar') && !f.name.contains('-dev') && !f.name.contains('-sources') && !f.name.contains('-nolib')) {
                copy { from f; into out }
                file(out.parentFile.path + "/all").mkdirs(); copy { from f; into file(out.parentFile.path + "/all") }
                println "collected ${f.name} -> ${out.absolutePath}"
            }
        }
        // 顺手清掉 legacy 和 all 里的非当前版本残留
        [out, file(out.parentFile.path + "/all")].each { d ->
            d.listFiles()?.each { f ->
                if (f.name.startsWith("OpenDreamCore-Legacy-") && f.name.endsWith('.jar')
                        && !f.name.contains("-${version}.jar")) {
                    delete f
                }
            }
        }
    }
}
build.dependsOn collectLegacyOutput
