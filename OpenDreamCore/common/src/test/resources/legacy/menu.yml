
# 匹配界面名,hud为自动开启
# GuiInventory可以替换背包
# GuiIngameMenu可以替换ESC
# 或者直接填写箱子界面名称，即可替换箱子界面(颜色符号需写为§)
match: "龙核菜单"

# 禁止ESC直接关闭界面，采用Functions的按键监听来关闭界面
allowEscClose: true

Functions:
  keyPress: "(方法.取当前按下键=='E' || 方法.取当前按下键=='ESCAPE')?{方法.异步执行方法('关闭界面');}:0"
  open: |-
    方法.异步执行方法('每秒重新计算绘制起始点和更新变量');
    方法.异步执行方法('槽位检测');
    方法.异步执行方法('循环检测');
    (方法.取物品数(方法.取物品('引导槽位'))=='0')?{方法.设置组件值('图片名称','texture','引导/引导1.gif');}:0;
    (方法.取物品数(方法.取物品('壁纸槽位'))=='0')?{方法.设置组件值('背景','texture','菜单/背景图层.png');}:0;
    方法.播放声音('菜单/打开菜单.ogg')

  关闭界面: |-
    界面变量.关闭时间=方法.取当前时间;
    方法.延时(100);
    方法.关闭界面;
    方法.播放声音('菜单/选择.ogg')

  每秒重新计算绘制起始点和更新变量: |-
    方法.更新变量值('vault_eco_balance');
    方法.更新变量值('playerpoints_points');
    方法.更新变量值('localtime_time');
    方法.更新变量值('player_name');
    方法.更新变量值('bungee_1F');
    方法.更新变量值('combatpower_me');
    方法.更新变量值('nyeconomy_梨钻');
    方法.延时(1000);                         
    方法.异步执行方法('每秒重新计算绘制起始点和更新变量');

  循环检测: |-
    (方法.取物品数(方法.取物品('引导槽位'))=='0')?{用户变量.槽位图片存储=('引导/引导1.gif');}:0;
    (方法.取物品数(方法.取物品('壁纸槽位'))=='0')?{用户变量.壁纸存储=('菜单/背景图层.png');}:0;
    方法.延时(1000);
    方法.异步执行方法('循环检测');

  槽位检测: |-
    界面变量.lore词条 = 方法.替换(方法.替换(方法.取物品lore(方法.取物品('引导槽位'),'0'),'引导系列:"',''),'"','');
    用户变量.槽位图片存储 = 方法.合并文本('引导/',界面变量.lore词条,'.gif');
    界面变量.头像选择 = 方法.替换(方法.替换(方法.取物品lore(方法.取物品('头像槽位'),'0'),'头像系列:"',''),'"','');
    用户变量.头像存储 = 方法.合并文本('头像/',界面变量.头像选择,'.png');
    界面变量.头像框选择 = 方法.替换(方法.替换(方法.取物品lore(方法.取物品('头像框槽位'),'0'),'头像框系列:"',''),'"','');
    用户变量.头像框存储 = 方法.合并文本('头像框/',界面变量.头像框选择,'.png');
    界面变量.壁纸选择 = 方法.替换(方法.替换(方法.取物品lore(方法.取物品('壁纸槽位'),'0'),'壁纸系列:"',''),'"','');
    用户变量.壁纸存储 = 方法.合并文本('壁纸/',界面变量.壁纸选择,'.png');
    方法.延时(1000);
    方法.异步执行方法('槽位检测');

  wheel: "滚动条_texture.distanceY=滚动条_texture.distanceY-滚动条_texture.maxDistanceY*0.03*方法.取滚轮值"
