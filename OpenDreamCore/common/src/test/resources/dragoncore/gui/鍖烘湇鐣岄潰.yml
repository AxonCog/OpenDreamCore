

Functions:
  open: |-
    方法.异步执行方法('屏幕自适应');
    方法.异步执行方法('参数判定');
    方法.异步执行方法('每秒重新计算绘制起始点和更新变量');
  屏幕自适应: |-
    界面变量.x比=方法.取屏幕宽度()/960;
    界面变量.y比=方法.取屏幕高度()/508.5;
    界面变量.xy比 = 界面变量.x比/界面变量.y比;
    界面变量.x=(方法.取屏幕宽度-方法.取组件值('主界面_texture','width'))/2;
    界面变量.y=(方法.取屏幕高度-方法.取组件值('主界面_texture','height'))/2;
    方法.延时(500);
    方法.异步执行方法('屏幕自适应');
