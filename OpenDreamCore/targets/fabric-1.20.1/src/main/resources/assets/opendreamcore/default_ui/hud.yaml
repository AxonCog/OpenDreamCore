# HUD 常驻示例：进服自动挂载（/odc hud 切换）
match: hud
display: hud
through: true

brand:
  type: text
  x: 10
  y: 6
  width: 120
  height: 12
  text:
    content: "OpenDreamCore"
    color: "#FFD700"

health_frame:
  type: layout
  x: 10
  y: 22
  width: 100
  height: 10
  background: "solid:20,20,30,160"
  children:
    health_bar:
      type: progress
      x: 0
      y: 0
      width: "parent.width"
      height: "parent.height"
      progress:
        min: 0
        max: 20
        value: 16
        color: "#E53935"

fps_text:
  type: text
  x: "window.width - 70"
  y: 6
  width: 60
  height: 12
  text:
    content: "FPS"
    align: right
    color: "#90CAF9"
