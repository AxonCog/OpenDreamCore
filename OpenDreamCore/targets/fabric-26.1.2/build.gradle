// OpenDreamCore target: fabric-1.21.1
// common/ 共享源码树由本 target 编译期合并；平台网络/渲染/入口在本 target 内。
// 与 neoforge-1.21.1 共用同一套 client 渲染代码（OdcScreen/UiRenderer/ClientController...）。

plugins {
    // 26.1.2 需 loom 1.18-alpha（配合自带 wrapper 的 Gradle 9.7；DC-26.1.2 同款已验证组合）
    id 'fabric-loom' version '1.18.0-alpha.15'
    id 'java'
    id 'com.gradleup.shadow' version '9.0.0'
}

// 加载共享元数据（根 gradle.properties）+ 本 target 覆盖（gradle.properties）
def properties = new Properties()
file('../../gradle.properties').withInputStream { properties.load(it) }
file('gradle.properties').withInputStream { properties.load(it) }
properties.each { key, value -> ext.set(key.toString(), value.toString()) }

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_name}-fabric-26.1.2"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// common/ 是共享源码树（零 MC 依赖），编译期合并进本 target。
// client/ 是双平台共享的客户端源码树（mojmap MC 客户端 API，见 client/README.md），同样编译期合并。
sourceSets {
    main {
        java.srcDir "$buildDir/generated/common-main"
        java.srcDir "$buildDir/generated/client-main"
        resources.srcDir '../../common/src/main/resources'
    }
}

// common/ 源码原样复制；antlr4-runtime 的包路径重定向由 shadow 插件在打包阶段完成。
tasks.register('prepareCommonSources', Sync) {
    from('../../common/src/main/java')
    into "$buildDir/generated/common-main"
}
// client/ 共享客户端源码原样复制（双平台同一份，改一处两端生效）。
tasks.register('prepareClientSources', Sync) {
    from('../../client/src/main/java')
    into "$buildDir/generated/client-main"
}
tasks.named('compileJava').configure { dependsOn 'prepareCommonSources', 'prepareClientSources', 'remapDrift' }

// 中文源码/注释：javac 显式 UTF-8（不依赖 daemon 编码）
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// 官方 mojmap（与 neoforge target 的混淆名一致，渲染/网络代码可直接对照）
loom {
    runs {
        client {
            client()
            ideConfigGenerated = true
        }
        server {
            server()
            ideConfigGenerated = true
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // 26.1+ 起 Mojang 移除混淆：官方 jar 即最终命名，Mojang 不再发布 mojmap。
    // 恒等 tiny 映射（双命名空间、零条目）：满足 loom mappings 管线要求且语义为"不重映射"。
    mappings files('mappings-noop.jar')
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // common 源码的运行时依赖（antlr4-runtime 需要随 mod 打包）
    // 编译期可见；运行时由 shadow 打平重定向后打进主 jar。
    implementation 'org.antlr:antlr4-runtime:4.13.1'
    // gson MC 运行时自带（compileOnly 即可）；snakeyaml Fabric 客户端不自带，
    // 必须 shade 进 jar（见下方 shadeOnly），否则运行时 NoClassDefFoundError
    compileOnly 'org.yaml:snakeyaml:2.2'
    compileOnly 'com.google.code.gson:gson:2.10.1'
}

// 专用于 shadow 的 configuration：只包含 antlr4-runtime，不传递 MC/fabric 的任何类
configurations {
    shadeOnly
}
dependencies {
    shadeOnly 'org.antlr:antlr4-runtime:4.13.1'
    // snakeyaml：Fabric 客户端类路径没有，必须打进 jar 并 relocate（与 NeoForge target 一致）
    shadeOnly 'org.yaml:snakeyaml:2.2'
}

// ---- shadow 配置 ----
// 仅把 antlr4-runtime 重定向并打平进主 jar，不再使用 include/jarinjar。
shadowJar {
    archiveClassifier = 'shadow'
    configurations = [project.configurations.shadeOnly]
    // 包路径重定向
    relocate 'org.antlr.v4.runtime', 'com.opendreamcore.shaded.antlr.v4.runtime'
    relocate 'org.yaml.snakeyaml', 'com.opendreamcore.shaded.snakeyaml'
    // 合并 META-INF 服务文件
    mergeServiceFiles()
}

// fabric-loom 的 remapJar 需要消费 shadowJar 的输出。
// 让 remapJar 的 input 指向 shadowJar 产出的 jar。
tasks.named('remapJar').configure {
    inputFile = tasks.named('shadowJar').get().archiveFile
    dependsOn tasks.named('shadowJar')
}

tasks.named('processResources') {
    inputs.property 'mod_id', mod_id
    inputs.property 'mod_version', mod_version
    inputs.property 'mod_name', mod_name
    inputs.property 'mod_description', mod_description
    filesMatching('fabric.mod.json') {
        expand(
                'mod_id': mod_id,
                'mod_version': mod_version,
                'mod_name': mod_name,
                'mod_description': mod_description
        )
    }
}

// build 完自动复制 jar 到 ../../../output
tasks.register('collectOutput') {
    group = 'build'
    description = 'Copy built jar to ../../../output'
    doLast {
        def out = file('../../../output')
        out.mkdirs()
        // 只收集当前版本产物，并清掉 output 里旧版本残留，防止误用陈旧 jar
        tasks.named('remapJar').get().archiveFile.get().asFile.parentFile.listFiles()?.each { f ->
            if (f.name.endsWith('.jar') && !f.name.contains('-dev') && !f.name.contains('-sources') && !f.name.contains('-shadow')) {
                copy { from f; into out }
                println "collected ${f.name} -> ${out.absolutePath}"
            }
        }
        file(out).listFiles()?.each { f ->
            if (f.name.startsWith("${mod_name}-") && f.name.endsWith('.jar')
                    && !f.name.contains("-${mod_version}.jar") && f.name != "OpenDreamCore-Plugin-${mod_version}.jar") {
                delete f
                println "removed stale ${f.name}"
            }
        }
    }
}
tasks.named('build').configure { finalizedBy tasks.named('collectOutput') }

// zipfs 探针（临时诊断）
tasks.register('zipfsProbe') {
    doLast {
        println "daemon java: ${System.getProperty('java.home')} v${System.getProperty('java.version')}"
        def mods = ModuleLayer.boot().modules().find { it.name == 'jdk.zipfs' }
        println "boot layer jdk.zipfs: ${mods != null}"
        try {
            def fs = java.nio.file.FileSystems.newFileSystem(new URI('jar', new File('gradlew.bat').toURI().toString(), null), java.util.Collections.emptyMap())
            fs.close(); println 'newFileSystem PASS'
        } catch (Throwable t) { println "newFileSystem FAIL: $t" }
    }
}

// ---- 26.x mojmap 漂移机械重映射（只作用于本 target 的一次性生成副本）----
// 家族：Identifier 改名 / GuiGraphics→GuiGraphicsExtractor / drawString→text / renderItem→item /
//       displayClientMessage→sendSystem/OverlayMessage / 输入事件记录 / Window.handle() / Camera.position()
tasks.register('remapDrift') {
    dependsOn 'prepareCommonSources', 'prepareClientSources'
    doLast {
        def BS_NL = System.lineSeparator()
        def INPUT_FILES = ['OdcScreen.java', 'WorldEditAlignScreen.java', 'WorldEditFindScreen.java',
                           'WorldEditPropQuickScreen.java', 'WorldEditPropScreen.java', 'WorldEditRenameScreen.java']
        [file("$buildDir/generated/common-main"), file("$buildDir/generated/client-main")].each { dir ->
            if (!dir.exists()) return
            dir.eachFileRecurse { f ->
                if (!f.name.endsWith('.java') || f.name == 'CompatInput.java' || f.name == 'CompatPlayer.java') return
                def text = f.getText('UTF-8')
                def r = text
                        .replaceAll(/\bResourceLocation\b/, 'Identifier')
                        .replaceAll(/\bGuiGraphics\b/, 'GuiGraphicsExtractor')
                        .replaceAll(/net[.]minecraft[.]client[.]gui[.]GuiGraphicsExtractor/, 'net.minecraft.client.gui.GuiGraphicsExtractor')
                        .replaceAll(/\.drawString\(/, '.text(')
                        .replaceAll(/\.renderItemDecorations\(/, '.itemDecorations(')
                        // 26.x EditBox.setFilter 移除：过滤降级为解析期校验（lambda 内无分号，语句级替换安全）
                        .replaceAll(/(?s)[a-zA-Z\.]*\.setFilter\([^;]*\);/, ';')
                        // 26.x 降级：renderStatic 已移除且新提交管线在独立 BufferSource 上下文不可用——保留变换，跳过世界物品图标渲染
                        .replace('mc.getItemRenderer().renderStatic(stack,' + BS_NL + '                    net.minecraft.world.item.ItemDisplayContext.FIXED,' + BS_NL + '                    0xF000F0, 0, pose, buffers, mc.level, 0);', '// [26.x 降级] 世界物品图标渲染跳过')
                        .replaceAll(/\.renderItem\((\w+), (\d+), (\d+)\)/, '.item($1, $2, $3)')
                        .replaceAll(/(?s)displayClientMessage[(](.+?[)])\s*,\s*false[)]/, 'sendSystemMessage($1)')
                        .replaceAll(/(?s)displayClientMessage[(](.+?[)])\s*,\s*true[)]/, 'sendOverlayMessage($1)')
                        .replaceAll(/\.getWindow\(\)\.getWindow\(\)/, '.getWindow().handle()')
                        .replaceAll(/(?<!CompatInput[.])(?:net[.]minecraft[.]client[.]gui[.]screens[.])?(?:Screen[.])?hasShiftDown[(][)]/, 'com.opendreamcore.client.CompatInput.hasShiftDown()')
                        .replaceAll(/(?<!CompatInput[.])(?:net[.]minecraft[.]client[.]gui[.]screens[.])?(?:Screen[.])?hasControlDown[(][)]/, 'com.opendreamcore.client.CompatInput.hasControlDown()')
                        .replaceAll(/(?<!CompatInput[.])(?:net[.]minecraft[.]client[.]gui[.]screens[.])?(?:Screen[.])?hasAltDown[(][)]/, 'com.opendreamcore.client.CompatInput.hasAltDown()')
                        .replaceAll(/\bviewHeight\b/, 'height')
                        // 26.x DynamicTexture 构造器需标签参数（贴图调试名）
                        .replaceAll(/new DynamicTexture\(img\)/, 'new DynamicTexture(() -> "opendreamcore_loose", img)')
                        // 26.x Identifier 构造器私有化，改走工厂
                        .replaceAll(/new Identifier\(/, 'Identifier.fromNamespaceAndPath(')
                        .replaceAll(/\.getDayTime\(\)/, '.getOverworldClockTime()')
                        .replaceAll(/mc\.gameRenderer\.getProjectionMatrix\(/, 'com.opendreamcore.client.CompatRender.projectionMatrix(mc.gameRenderer, ')
                        .replace('g.text(String.valueOf(c), 0, metrics.getAscent());', 'g.drawString(String.valueOf(c), 0, metrics.getAscent());')
                        .replaceAll(/\.getPosition\(\)/, '.position()')
                        .replaceAll(/[.]dimension[(][)][.]location[(][)]/, '.dimension().identifier()')
                        .replace('ChatScreen(initialText == null ? "" : initialText) {', 'ChatScreen(initialText == null ? "" : initialText, false) {')
                        .replaceAll(/mc[.]player[.]playNotifySound[(]/, 'com.opendreamcore.client.CompatPlayer.playNotifySound(mc.player, ')
                // Screen.render → extractRenderState（26.x 提交管线）
                r = r.replace('public void render(GuiGraphicsExtractor g, int mouseX, int mouseY, float partialTick) {',
                              'public void extractRenderState(GuiGraphicsExtractor g, int mouseX, int mouseY, float partialTick) {')
                r = r.replaceAll(/super\.render\(g, mouseX, mouseY, partialTick\)/, 'super.extractRenderState(g, mouseX, mouseY, partialTick)')
                r = r.replace('public void render(net.minecraft.client.gui.GuiGraphicsExtractor g, int mouseX, int mouseY, float partialTick) {',
                              'public void extractRenderState(net.minecraft.client.gui.GuiGraphicsExtractor g, int mouseX, int mouseY, float partialTick) {')
                r = r.replaceAll(/protected\s+void\s+renderWidget\(/, 'protected void extractWidgetRenderState(')
                if (f.name in INPUT_FILES) {
                    def MBE = 'net.minecraft.client.input.MouseButtonEvent'
                    def UNPACK_MOUSE = '{' + BS_NL + '        final double mouseX = __ev.x(); final double mouseY = __ev.y(); final int button = __ev.buttonInfo().button();'
                    def UNPACK_CLICK = '{' + BS_NL + '        final double mouseX = __ev.x(); final double mouseY = __ev.y();'
                    r = r
                        .replace('public boolean mouseClicked(double mouseX, double mouseY, int button) {',
                                 "public boolean mouseClicked(${MBE} __ev, boolean __dbl) ${UNPACK_MOUSE}")
                        .replace('public boolean mouseReleased(double mouseX, double mouseY, int button) {',
                                 "public boolean mouseReleased(${MBE} __ev) ${UNPACK_MOUSE}")
                        .replace('public boolean mouseDragged(double mouseX, double mouseY, int button, double dragX, double dragY) {',
                                 "public boolean mouseDragged(${MBE} __ev, double dragX, double dragY) ${UNPACK_MOUSE}")
                        .replace('public void onClick(double mouseX, double mouseY) {',
                                 "public void onClick(${MBE} __ev, boolean __dbl) ${UNPACK_CLICK}")
                        .replace('public boolean charTyped(char codePoint, int modifiers) {',
                                 'public boolean odcCharTypedX(net.minecraft.client.input.CharacterEvent __ev) {'+ BS_NL + '        final char codePoint = (char) __ev.codepoint(); final int modifiers = 0;')
                        .replace('odcCharTypedX(net.minecraft.client.input.CharacterEvent',
                                 'charTyped(net.minecraft.client.input.CharacterEvent')
                        .replace('public boolean keyPressed(int keyCode, int scanCode, int modifiers) {',
                                 'public boolean keyPressed(net.minecraft.client.input.KeyEvent __ev) {' + BS_NL + '        final int keyCode = __ev.key(); final int scanCode = __ev.scancode(); final int modifiers = __ev.modifiers();')
                        .replaceAll(/super\.keyPressed\(keyCode, scanCode, modifiers\)/,
                                 'super.keyPressed(new net.minecraft.client.input.KeyEvent(keyCode, scanCode, modifiers))')
                        .replaceAll(/super\.mouseClicked\(mouseX, mouseY, button\)/,
                                 "super.mouseClicked(new ${MBE}(mouseX, mouseY, new net.minecraft.client.input.MouseButtonInfo(button, 0)), false)")
                        .replaceAll(/super\.mouseReleased\(mouseX, mouseY, button\)/,
                                 "super.mouseReleased(new ${MBE}(mouseX, mouseY, new net.minecraft.client.input.MouseButtonInfo(button, 0)))")
                        .replaceAll(/super\.mouseDragged\(mouseX, mouseY, button, dragX, dragY\)/,
                                 "super.mouseDragged(new ${MBE}(mouseX, mouseY, new net.minecraft.client.input.MouseButtonInfo(button, 0)), dragX, dragY)")
                        .replaceAll(/hovered[.]onClick[(]mx, my[)]/,
                                 "hovered.onClick(new ${MBE}(mx, my, new net.minecraft.client.input.MouseButtonInfo(0, 0)), false)")
                }
                if (r != text) { f.write(r, 'UTF-8') }
            }
        }
    }
}
tasks.named('prepareCommonSources') { outputs.upToDateWhen { false } }
tasks.named('prepareClientSources') { outputs.upToDateWhen { false } }
tasks.named('compileJava').configure { dependsOn 'remapDrift' }
