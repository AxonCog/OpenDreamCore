name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-server: 
    name: Build Server-side
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Plugin
        working-directory: OpenDreamCore-Plugin
        run: ./gradlew build --no-daemon

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: odc-server
          path: output/*.jar

  build-client:
    name: Build Client-side
    uses: ./.github/workflows/ci_build-client.yml
    secrets: inherit