name: ODC Matrix CI

on:
  push:
    branches: [main, master]
  pull_request:

# 仓库构建依赖本机缓存的 Minecraft 反编译产物与固定 JDK 路径（见 build_matrix.ps1），
# 通用 Runner 上无法复现 "16 target 全构建"；CI 承担的是结构门禁：
# sync_check.ps1 全绿才允许合并（契约面齐 + mixin 注册一致）。
# 全版本编译矩阵由维护者在开发机跑 build_matrix.ps1 把关。
jobs:
  gate:
    name: 结构门禁（sync_check）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 结构门禁 sync_check
        shell: pwsh
        run: |
          pwsh tools/sync_check.ps1