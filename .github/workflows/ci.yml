name: ODC Matrix CI

on:
  push:
    branches: [main, master]
  pull_request:

# 结构门禁：sync_check.ps1 全绿才允许合并（逐 target 断言「契约实现」齐不齐 + mixin 注册一致）。
# 编译矩阵在 .github/workflows/release.yml —— 12 个现代目标 + 插件都能在通用 Runner 上编：
# 每个目标用自带的 ./gradlew，并用 -Dorg.gradle.java.home="$JAVA_HOME" 压过
# gradle.properties 里写死的开发机 JDK 路径（已本机实测该 -D 覆盖确实生效）。
# 4 个 Legacy 目标（forge-1.6.4/1.7.10/1.12.2/1.16.5）仍只在开发机编：它们的
# OpenDreamCore-Legacy/libs 与 tools（mcp/srg/SpecialSource/本地 forge 产物）不入库。
jobs:
  gate:
    name: 结构门禁（sync_check）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 结构门禁 sync_check
        shell: pwsh
        run: |
          pwsh .github/scripts/sync_check.ps1