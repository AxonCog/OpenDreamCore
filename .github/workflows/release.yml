name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build NeoForge
        working-directory: OpenDreamCore
        run: ./gradlew -p targets/neoforge-1.21.1 build --no-daemon

      - name: Build Fabric
        working-directory: OpenDreamCore
        run: ./gradlew -p targets/fabric-1.21.1 build --no-daemon

      - name: Build Plugin
        working-directory: OpenDreamCore-Plugin
        run: ./gradlew build --no-daemon

      - name: Collect jars
        run: |
          mkdir -p output
          find . -name "*.jar" -path "*/build/libs/*" \
            ! -name "*-sources*" ! -name "*-javadoc*" ! -name "*-dev*" \
            -exec cp {} output/ \;

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          files: output/*.jar
