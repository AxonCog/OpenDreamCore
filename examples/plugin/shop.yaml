# 服务器商店示例：/odc open shop 或 match 触发
# 点击购买 → 服务端裁决脚本扣金币 → state_patch 实时刷新
match: shop
title: 服务器商店
coin: 100

title_text:
  type: text
  x: 0
  y: 10
  width: "window.width"
  height: 30
  text:
    content: "服务器商店"
    align: center
    color: "#FFD700"

coin_line:
  type: text
  x: "window.width / 2 - 140"
  y: 48
  width: 280
  height: 20
  text:
    content: "我的金币: {{vars.coin}}"
    color: "#9CCC65"

sword_row:
  type: layout
  x: "window.width / 2 - 140"
  y: 80
  width: 280
  height: 40
  children:
    sword_icon:
      type: item_slot
      x: 0
      y: 0
      width: 40
      height: 40
      item: "minecraft:diamond_sword"
    sword_info:
      type: text
      x: 48
      y: 2
      width: 120
      height: 16
      text:
        content: "钻石剑"
        color: "#B0BEC5"
      tooltip: "锋利 V 的钻石剑，50 金币"
    sword_price:
      type: text
      x: 48
      y: 20
      width: 120
      height: 16
      text:
        content: "售价: 50 金币"
        color: "#FFD54F"
buy_sword:
  type: button
  x: "window.width / 2 + 40"
  y: 85
  width: 80
  height: 28
  button:
    label: "购买"
    background: "#3A7D44"
  actions:
    click: |-
      变量 price = 50
      如果 (vars.coin >= price) {
        Screen.更新状态("coin", vars.coin - price)
        Chat.发送消息("购买成功！")
        Sound.播放音效("minecraft:entity.experience_orb.pickup")
      } 否则 {
        Chat.发送消息("金币不足，还差 " + (price - vars.coin))
      }

pickaxe_row:
  type: layout
  x: "window.width / 2 - 140"
  y: 130
  width: 280
  height: 40
  children:
    pick_icon:
      type: item_slot
      x: 0
      y: 0
      width: 40
      height: 40
      item: "minecraft:diamond_pickaxe"
    pick_info:
      type: text
      x: 48
      y: 2
      width: 120
      height: 16
      text:
        content: "钻石镐"
        color: "#B0BEC5"
      tooltip:
        content: "效率 IV 的钻石镐，80 金币"
        color: "#FFD54F"
    pick_price:
      type: text
      x: 48
      y: 20
      width: 120
      height: 16
      text:
        content: "售价: 80 金币"
        color: "#FFD54F"
buy_pickaxe:
  type: button
  x: "window.width / 2 + 40"
  y: 135
  width: 80
  height: 28
  button:
    label: "购买"
    background: "#3A7D44"
  actions:
    click: |-
      变量 price = 80
      如果 (vars.coin >= price) {
        Screen.更新状态("coin", vars.coin - price)
        Chat.发送消息("购买成功！")
        Sound.播放音效("minecraft:entity.experience_orb.pickup")
      } 否则 {
        Chat.发送消息("金币不足，还差 " + (price - vars.coin))
      }

close_btn:
  type: button
  x: "window.width / 2 - 40"
  y: 190
  width: 80
  height: 26
  button:
    label: "关闭"
    background: "#B71C1C"
  actions:
    click: |-
      Screen.关闭页面()
