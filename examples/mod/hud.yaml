# HUD 常驻示例：进服自动挂载（/odc hud 切换）
# HUD 页面同样支持 animations（自动播放/命名/预置特效），服务端可 ui_animation 远程触发
match: hud
display: hud
through: true

animations:
  brand:
    - preset: fade_in
      duration: 600
  health_frame:
    - preset: slide_left
      duration: 500
      delay: 200
  fps_text:
    - property: opacity
      from: 0.3
      to: 1
      duration: 1200
      easing: sine_in_out
      loop: true
      pingpong: true

brand:
  type: text
  x: 10
  y: 6
  width: 120
  height: 12
  text:
    content: "OpenDreamCore"
    color: "#FFD700"

health_frame:
  type: layout
  x: 10
  y: 22
  width: 100
  height: 10
  background: "solid:20,20,30,160"
  children:
    health_bar:
      type: progress
      x: 0
      y: 0
      width: "parent.width"
      height: "parent.height"
      progress:
        min: 0
        max: 20
        value: 16
        color: "#E53935"

fps_text:
  type: text
  x: "window.width - 70"
  y: 6
  width: 60
  height: 12
  text:
    content: "FPS"
    align: right
    color: "#90CAF9"

